name: inbox → Supabase
# Any push that adds/changes inbox/*.json uploads it to Supabase and then removes the file.
on:
  push:
    paths: ["inbox/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: inbox
jobs:
  upload:
    if: github.repository == 'AMV-00/ahlams-library'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Upload inbox
        env:
          SUPABASE_URL: https://wznocqfkslmbzuizsiib.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/inbox-upload.mjs
      - name: Remove processed files
        run: |
          git add -A inbox
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "inbox: uploaded to Supabase [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
