name: Deploy Edge Functions
# Any push to main that changes supabase/functions/** deploys them. Needs the repo secret SUPABASE_ACCESS_TOKEN
# (Supabase dashboard > Account > Access Tokens). GROQ_API_KEY stays a Supabase secret and is never touched here.
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:
concurrency: deploy-functions
jobs:
  deploy:
    if: github.repository == 'AMV-00/ahlams-library'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Add the repo secret SUPABASE_ACCESS_TOKEN first"; exit 1; fi
          for f in cat cat-voice cat-tts; do supabase functions deploy "$f" --project-ref wznocqfkslmbzuizsiib --use-api; done
