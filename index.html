<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<script>try{var t=localStorage.getItem("lib-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Ahlam's Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<form class="login" id="login" hidden>
  <img src="cat/happy.png" alt="">
  <h1>Ahlam's Library</h1>
  <input id="email" type="email" autocomplete="username" placeholder="Email" required>
  <input id="pass" type="password" autocomplete="current-password" placeholder="Password" required>
  <button class="save" type="submit" id="loginBtn">دخول / Sign in</button>
  <p class="err" id="loginErr" hidden></p>
</form>

<div class="wrap" id="app" hidden>
  <header class="top-h">
    <div class="brand"><img src="cat/happy.png" alt="" width="44" height="44"><div><h1 id="h1">Ahlam's Library</h1><p class="sub" id="hsub"></p></div></div>
    <div class="hbtns"><button class="ghost" id="trailBtn" type="button" aria-pressed="false">🐾</button><button class="ghost" id="theme" type="button"></button><button class="ghost" id="lang" type="button">EN</button><button class="ghost" id="logout" type="button"></button></div>
  </header>
  <div class="toolbar">
  <label class="search" for="q">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" enterkeyhint="search">
    <kbd class="kbd" aria-hidden="true">/</kbd>
  </label>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
  <form class="addsec" id="addsec" hidden>
    <input id="secAr" type="text" maxlength="30" autocomplete="off">
    <input id="secEn" type="text" maxlength="30" autocomplete="off">
    <button class="save" type="submit" id="secSave"></button>
    <button class="ghost" type="button" id="secCancel"></button>
    <p class="err" id="secErr" hidden></p>
  </form>
  <section class="recs" id="recs" hidden aria-label="Recommendations"></section>
  <section class="filters" aria-label="Filters">
    <div class="frow">
      <div class="counts" id="counts" role="group"></div>
      <div class="fsel">
        <label class="sel"><span class="vh" id="typeLbl"></span><select id="typeSel" aria-labelledby="typeLbl"></select></label>
        <label class="sel"><span class="vh" id="sortLbl"></span><select id="sortSel" aria-labelledby="sortLbl"></select></label>
      </div>
    </div>
    <div class="frow2" aria-live="polite">
      <span class="lbl" id="plabel"></span>
      <div class="bar"><i id="pbar" style="width:0%"></i></div>
      <span class="rcount" id="rcount"></span>
      <button class="linkbtn" type="button" id="clearF" hidden></button>
    </div>
  </section>
  <main class="grid" id="grid"></main>
  <p class="msg" id="msg"></p>
</div>

<div id="catUi" hidden>
  <button class="cat" id="cat" type="button" aria-label="Open assistant"><img id="catImg" src="cat/happy.png" alt=""></button>
  <div class="toast" id="toast" hidden></div>
  <section class="chat" id="chat" hidden aria-label="Assistant" aria-labelledby="catName">
    <header class="chat-h">
      <img id="chatImg" src="cat/happy.png" alt="">
      <div class="who"><b id="catName"></b><small id="catSub"></small></div>
      <div class="chat-tools">
        <button class="ib" id="histBtn" type="button" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button>
        <button class="ib" id="newChat" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="ib" id="voiceBtn" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
        <button class="ib" id="setBtn" type="button" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <button class="ib" id="sizeBtn" type="button" aria-pressed="false"><svg class="i-grow" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg><svg class="i-shrink" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg></button>
        <button class="ib" id="closeChat" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
    </header>
    <form class="settings" id="setForm" hidden><label for="nameIn" id="nameLbl"></label><input id="nameIn" maxlength="24" autocomplete="off"><label for="voiceSel" id="voiceLbl"></label><select id="voiceSel"><option value="noura">Noura</option><option value="lulwa">Lulwa</option><option value="aisha">Aisha</option><option value="fahad">Fahad</option><option value="sultan">Sultan</option><option value="abdullah">Abdullah</option></select><button class="save" type="submit" id="nameSave"></button></form>
    <div class="chat-list" id="chatList" hidden></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="chat-foot">
      <div class="quick" id="quick"></div>
      <div class="vstatus" id="vstatus" role="status" aria-live="polite" hidden><i class="dot"></i><div class="vcol"><span id="vtext"></span><small id="vheard" hidden></small></div></div>
      <div class="att-chip" id="attChip" hidden></div>
      <form id="askForm" class="composer">
        <textarea id="askIn" rows="1" autocomplete="off" enterkeyhint="send"></textarea>
        <input type="file" id="attFile" multiple accept=".pdf,application/pdf,image/*,.txt,.md,.csv,.json,text/plain,text/markdown" hidden>
        <button class="ib att" id="attBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.4 3.4 0 0 1 4.8 4.8l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg></button>
        <button class="ib mic" id="listenBtn" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button class="save send" id="sendBtn" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      </form>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="config.js"></script>
<script src="md.js"></script>
<script src="voice.js"></script>
<script src="dobby.js"></script>
<script src="recs.js"></script>
<script src="app.js"></script>
<script src="attach.js"></script>
<script src="chats.js"></script>
<script src="cat-trail.js"></script>
</body>
</html>
