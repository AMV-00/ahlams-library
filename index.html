<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ahlam's Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<form class="login" id="login" hidden>
  <img src="cat/happy.png" alt="">
  <h1>Ahlam's Library</h1>
  <input id="email" type="email" autocomplete="username" placeholder="Email" required>
  <input id="pass" type="password" autocomplete="current-password" placeholder="Password" required>
  <button class="save" type="submit" id="loginBtn">دخول / Sign in</button>
  <p class="err" id="loginErr" hidden></p>
</form>

<div class="wrap" id="app" hidden>
  <header class="top-h">
    <div><h1 id="h1">Ahlam's Library</h1><p class="sub" id="hsub"></p></div>
    <div class="hbtns"><button class="ghost" id="lang" type="button">EN</button><button class="ghost" id="logout" type="button" title="Sign out">⎋</button></div>
  </header>
  <label class="search" for="q">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off">
  </label>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <form class="addsec" id="addsec" hidden>
    <input id="secAr" type="text" maxlength="30" autocomplete="off">
    <input id="secEn" type="text" maxlength="30" autocomplete="off">
    <button class="save" type="submit" id="secSave"></button>
    <button class="ghost" type="button" id="secCancel"></button>
    <p class="err" id="secErr" hidden></p>
  </form>
  <section class="strip" aria-live="polite">
    <div class="lbl" id="plabel"></div><div class="counts" id="counts"></div>
    <div class="bar"><i id="pbar" style="width:0%"></i></div>
  </section>
  <main class="grid" id="grid"></main>
  <p class="msg" id="msg"></p>
</div>

<div id="catUi" hidden>
  <button class="cat" id="cat" type="button" aria-label="Open assistant"><img id="catImg" src="cat/happy.png" alt=""></button>
  <div class="toast" id="toast" hidden></div>
  <section class="chat" id="chat" hidden aria-label="Assistant">
    <header><img id="chatImg" src="cat/happy.png" alt=""><b id="catName"></b>
      <button class="ib" id="voiceBtn" type="button" aria-pressed="false" title="Voice">🔈</button>
      <button class="ib" id="setBtn" type="button" title="Settings">⚙</button>
      <button class="ib" id="closeChat" type="button" title="Close">✕</button></header>
    <form class="settings" id="setForm" hidden><label for="nameIn" id="nameLbl"></label><input id="nameIn" maxlength="24" autocomplete="off"><button class="save" type="submit" id="nameSave"></button></form>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="quick" id="quick"></div>
    <form id="askForm"><input id="askIn" autocomplete="off"><button class="save" type="submit">↑</button></form>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="config.js"></script>
<script src="md.js"></script>
<script src="voice.js"></script>
<script src="app.js"></script>
</body>
</html>
